<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Maktab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- prompt cursor bracket > -->
  <path d="M120 188 L196 256 L120 324"
        stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92"/>

  <!-- horizontal underline (input line) -->
  <rect x="216" y="338" width="180" height="20" rx="10" fill="#ffffff" opacity="0.55"/>

  <!-- spark / sparkle (the "magic" the prompt produces) -->
  <g filter="url(#glow)">
    <path d="M360 120 L376 168 L424 184 L376 200 L360 248 L344 200 L296 184 L344 168 Z"
          fill="url(#spark)"/>
  </g>
</svg>
