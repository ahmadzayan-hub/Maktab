name: Student journey acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: study-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Arabic mobile and first study session
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "false"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Build isolated workspace (synthetic API fixtures only)
        run: npm run build
      - name: Verify synthetic journeys without credentials
        run: |
          mkdir -p test-results
          npm run start -- --hostname 127.0.0.1 --port 3147 > test-results/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:3147/dashboard > /dev/null; then break; fi
            sleep 1
          done
          python tests/e2e/study_journey.py
          python tests/e2e/local_document_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-study-journey
          path: test-results/
          retention-days: 7
